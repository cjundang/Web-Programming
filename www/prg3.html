<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hour 3 : JSON and Web API</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- Title -->
    <div class="text-center mb-4">
        <h2>JSON and Web API</h2>
        <p class="text-muted">Hour 3 : Fetch data from API</p>
    </div>

    <!-- JSON from Variable -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="card-title">JSON from JavaScript Object</h4>
            <button class="btn btn-secondary mb-3" onclick="showLocalJSON()">
                Show Local JSON
            </button>
            <p id="localOutput">-</p>
        </div>
    </div>

    <!-- Web API Section -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title">Web API : User List</h4>
            <button class="btn btn-primary mb-3" onclick="loadUsers()">
                Load Users from API
            </button>

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>City</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr>
                        <td colspan="3" class="text-center">No data</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    /* ---------- Part 1 : Local JSON ---------- */
    function showLocalJSON() {
        let student = {
            name: "Alice",
            age: 16,
            score: 85
        };

        document.getElementById("localOutput").innerHTML =
            "Name: " + student.name +
            ", Age: " + student.age +
            ", Score: " + student.score;
    }

    /* ---------- Part 2 : Web API with fetch() ---------- */
    function loadUsers() {
        fetch("https://jsonplaceholder.typicode.com/users")
            .then(response => response.json())
            .then(data => {
                let table = document.getElementById("userTable");
                table.innerHTML = "";

                for (let i = 0; i < data.length; i++) {
                    table.innerHTML += `
                        <tr>
                            <td>${data[i].name}</td>
                            <td>${data[i].email}</td>
                            <td>${data[i].address.city}</td>
                        </tr>
                    `;
                }
            })
            .catch(error => {
                alert("Error loading data");
            });
    }
</script>

</body>
</html>
